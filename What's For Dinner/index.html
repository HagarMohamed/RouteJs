<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="./css/style.css">

    <title>What's For Dinner</title>
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">

        <div class="container">

            <div class="navbar-brand-wrapper">
                <img src="./img/logo.png" alt="">
                <a class="navbar-brand font-weight-bold" href="index.html">
                    What's For Dinner
                </a>

                <small class="d-block text-muted">
                    Your daily meal inspiration
                </small>
            </div>

            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="fa fa-home"></i>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">
                            <i class="fa fa-info-circle"></i>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">
                            <i class="fa fa-envelope"></i>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="login.html">
                            <img src="./img/avatar-4.jpg" alt="profile" class="rounded-circle img-fluid avatar">
                        </a>
                    </li>

                </ul>
            </div>

        </div>

    </nav>


    <!--Main Content -->

   <main class="container recipe-page">

    <div class="card shadow-lg border-0 recipe-card">

        <div class="row">

            <div class="col-md-4 position-relative">

                <img src="" class="img-fluid recipe-image"  alt="Chicken Stir-Fry">


                <div class="rating-badge">

                    <i class="fa fa-star"></i>

                    <strong id ="recipe-rating"></strong>

                    <span id="recipe-reviews"> </span>

                </div>

                <div class="image-info bg-white shadow">

                    <div class="info-item">

                        <i class="fa fa-clock-o"></i>

                        <div>
                            <small>Prep Time</small>
                            <strong>15 min</strong>
                        </div>

                    </div>


                    <div class="info-item">

                        <i class="fa fa-fire"></i>

                        <div>
                            <small>Cook Time</small>
                            <strong>20 min</strong>
                        </div>

                    </div>


                    <div class="info-item">

                        <i class="fa fa-users"></i>

                        <div>
                            <small>Servings</small>
                            <strong>4</strong>
                        </div>

                    </div>

                </div>

            </div>



            <div class="col-md-8">

                <div class="card-body recipe-content">


                    <div class="mb-3">

                        <span class="badge badge-pill badge-easy">
                            
                        </span>

                        <span class="badge badge-pill badge-asian">
                            
                        </span>

                    </div>



                    <div class="d-flex justify-content-between align-items-start">

                        <div class="recipe-title-wrapper">

                            <h1  class="recipe-title">
                                
                            </h1>

                            <p  class="recipe-description">
                                
                            </p>

                        </div>

                        <div class="d-flex ml-3">

                            <button class="action-btn">
                                <i class="fa fa-bookmark"></i>
                            </button>

                            <button class="action-btn">
                                <i class="fa fa-share-alt"></i>
                            </button>

                        </div>

                    </div>


                    <ul class="nav nav-tabs recipe-tabs mt-4"
                        role="tablist">

                        <li class="nav-item">

                            <a class="nav-link active" data-toggle="tab"  href="#ingredients">

                                <i class="fa fa-list-ul"></i> Ingredients

                            </a>

                        </li>


                        <li class="nav-item">

                            <a class="nav-link" data-toggle="tab" href="#instructions">

                                <i class="fa fa-book"></i> Instructions

                            </a>

                        </li>


                        <li class="nav-item">

                            <a class="nav-link" data-toggle="tab" href="#nutrition">

                                <i class="fa fa-pie-chart"></i> Nutrition

                            </a>

                        </li>


                        <li class="nav-item">

                            <a class="nav-link" data-toggle="tab" href="#chef">

                                <i class="fa fa-lightbulb-o"></i> Chef's Tips

                            </a>

                        </li>

                    </ul>


                    <div class="tab-content mt-4">


                        <div class="tab-pane fade show active" id="ingredients">

                            <div class="ingredients-box">

                                <ul class="ingredients-list list-unstyled mb-0">

                                    <li>
                                        <span>1</span>
                                        
                                    </li>

                                    <li>
                                        <span>2</span>
                                        
                                    </li>

                                    <li>
                                        <span>3</span>
                                        
                                    </li>

                                    <li>
                                        <span>4</span>
                                        
                                    </li>

                                    <li>
                                        <span>5</span>
                                        
                                    </li>

                                    <li>
                                        <span>6</span>
                                        
                                    </li>

                                    <li>
                                        <span>7</span>
                                        
                                    </li>

                                    <li>
                                        <span>8</span>
                                        
                                    </li>

                                    <li>
                                        <span>9</span>
                                        
                                    </li>

                                </ul>

                            </div>

                        </div>


                        <div class="tab-pane fade" id="instructions">

                            <div class="content-box instructions-list">

                                <p>
                                    <strong>1.</strong>
                                    
                                </p>

                                <p>
                                    <strong>2.</strong>
                                    
                                </p>

                                <p>
                                    <strong>3.</strong>
                                    
                                </p>

                                <p>
                                    <strong>4.</strong>
                                    
                                </p>

                                <p>
                                    <strong>5.</strong>
                                    
                                </p>

                                

                            </div>

                        </div>


                        <div class="tab-pane fade"  id="nutrition">

                            <div class="content-box">

                                <p id="recipe-calories">Calories: <span></span></p>

                                <p id="recipe-carbs">Carbohydrates: <span></span></p>

                                <p id="recipe-fat">Fat: <span></span></p>

                                <p id="recipe-protein">Protein: <span></span></p>
                                <p id="recipe-fiber">Fiber: <span></span></p>

                            </div>

                        </div>


                        <div class="tab-pane fade"  id="chef">

                            <div class="content-box">

                                <p id="recipe-tips">
                                   Tip 1: <span></span>
                                    
                                </p>

                                <p id="recipe-tips2">
                                   Tip 2: <span></span>
                                   
                                </p>

                                <!-- <p>
                                    <strong>Tip 3:</strong>
                                    Serve immediately while vegetables are crisp.
                                </p> -->

                            </div>

                        </div>

                    </div>

                </div>
                <!-- <hr>

                <div class="p-3">
                    <button class="btn btn-primary p-2"><i class="fa fa-refresh"></i> Try Another Recipe</button>
                </div> -->

            </div>

        </div>

    </div>

</main>




</body>
   <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="./js/script.js"></script>

</html>
