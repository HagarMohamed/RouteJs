<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">

    <title>What's For Dinner</title>
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">

        <div class="container">

            <div class="me-2">
                 <i class="fa-solid fa-utensils"></i>
            </div>

            <div class="navbar-brand-wrapper">
                <a class="navbar-brand font-weight-bold" href="index.html">
                    What's For Dinner
                </a>

                <small class="d-block text-muted">
                    Your daily meal inspiration
                </small>
            </div>

            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav align-items-center">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="fa-solid fa-bookmark"></i>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">
                            <i class="fa-solid fa-gear"></i>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="login.html">
                            <img src="./img/avatar-4.jpg" alt="profile" class="rounded-circle img-fluid avatar">
                        </a>
                    </li>

                </ul>
            </div>

        </div>

    </nav>


    <!--Main Content -->

    <main class="container recipe-page">

        <div class="card shadow-lg border-0 recipe-card">

            <div class="row">

                <div class="col-md-5 position-relative">

                    <img src="" class="img-fluid recipe-image" alt="Chicken Stir-Fry">


                    <div class="rating-badge">

                        <i class="fa-solid fa-star"></i>

                        <strong id="recipe-rating"></strong>

                        <span id="recipe-reviews"> </span>

                    </div>

                    <div class="image-info bg-white shadow">

                        <div class="info-item">

                            <i class="fa-solid fa-clock" style="color: orange;"></i>

                            <div>
                                <small class="text-muted">Prep Time</small>
                                <br>
                                <strong class="prep-time"></strong>
                            </div>

                        </div>


                        <div class="info-item">

                            <i class="fa-solid fa-fire-burner" style="color: red;"></i>

                            <div>
                                <small class="text-muted">Cook Time</small>
                                <br>
                                <strong class="cook-time"></strong>
                            </div>

                        </div>


                        <div class="info-item">

                            <i class="fa-solid fa-users" style="color: blue;"></i>

                            <div>
                                <small class="text-muted">Servings</small>
                                <br>
                                <strong class=" total-time"></strong>
                            </div>

                        </div>

                    </div>

                </div>



                <div class="col-md-7">

                    <div class="card-body recipe-content">


                        <div class="mb-3">

                            <span class="badge badge-pill badge-easy">

                            </span>

                            <span class="badge badge-pill badge-asian">

                            </span>

                        </div>



                        <div class="d-flex justify-content-between align-items-start">

                            <div class="recipe-title-wrapper">

                                <h1 class="recipe-title">

                                </h1>

                                <p class="recipe-description">

                                </p>

                            </div>

                            <div class="d-flex ml-3">

                                <button class="action-btn">
                                    <i class="fa fa-bookmark"></i>
                                </button>

                                <button class="action-btn">
                                    <i class="fa fa-share-alt"></i>
                                </button>

                            </div>

                        </div>


                        <ul class="nav nav-tabs recipe-tabs mt-4" role="tablist">

                            <li class="nav-item">

                                <a class="nav-link active" data-bs-toggle="tab" href="#ingredients">

                                    <i class="fa fa-list-ul"></i> Ingredients

                                </a>

                            </li>


                            <li class="nav-item">

                                <a class="nav-link" data-bs-toggle="tab" href="#instructions">

                                    <i class="fa fa-book"></i> Instructions

                                </a>

                            </li>


                            <li class="nav-item">

                                <a class="nav-link" data-bs-toggle="tab" href="#nutrition">

                                    <i class="fa fa-pie-chart"></i> Nutrition

                                </a>

                            </li>


                            <li class="nav-item">

                                <a class="nav-link" data-bs-toggle="tab" href="#chef">

                                    <i class="fa fa-lightbulb-o"></i> Chef's Tips

                                </a>

                            </li>

                        </ul>


                        <div class="tab-content mt-4">


                            <div class="tab-pane fade show active" id="ingredients">

                                <div class="ingredients-box">

                                    <ul class="ingredients-list list-unstyled mb-0">



                                    </ul>

                                </div>

                            </div>


                            <div class="tab-pane fade" id="instructions">

                                <div class="content-box instructions-list">



                                </div>

                            </div>


                            <div class="tab-pane fade" id="nutrition">

                               <div class="nutrition-box">

                                    <div class="row">

                                        <div class="col-md-6">

                                            <p id="recipe-calories">
                                                <!-- <i class="fa-solid fa-fire"></i> Calories -->
                                            </p>

                                            <p id="recipe-carbs">
                                                <!-- <i class="fa-solid fa-wheat-awn"></i> Carbohydrates -->
                                            </p>

                                            <p id="recipe-fiber">
                                                <!-- <i class="fa-solid fa-leaf"></i> Fiber -->
                                            </p>

                                        </div>

                                        <div class="col-md-6">

                                            <p id="recipe-fat">
                                                <!-- <i class="fa-solid fa-droplet"></i> Fat -->
                                            </p>

                                            <p id="recipe-protein">
                                                <!-- <i class="fa-solid fa-dumbbell"></i> Protein -->
                                            </p>

                                            <p id="recipe-sodium">
                                                <!-- <i class="fa-solid fa-bowl-food"></i> Sodium -->
                                            </p>

                                        </div>

                                    </div>

                                </div>

                            </div>


                            <div class="tab-pane fade" id="chef">

                                <ul class="chefTips-box  list-unstyled">
                                    <!-- 
                                <p id="recipe-tips">
                                    <i class="fa fa-lightbulb-o"></i>
                                   Tip 1: 
                                    
                                </p> -->





                                </ul>

                            </div>

                        </div>

                    </div>
                    <hr>

                <div class="p-3">
                    <button class="btn-refresh"><i class="fa fa-refresh"></i> Try Another Recipe</button>
                </div>

                </div>

            </div>

        </div>

    </main>




</body>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="./js/script.js"></script>

</html>
