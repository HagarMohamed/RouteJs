<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ContactHub</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">


    
</head>

<body>

<!-- ================= HEADER ================= -->

<nav class="navbar">
    <div class="container-fluid px-4 px-lg-5">

        <div class="d-flex align-items-center gap-3">

            <div class="brand-icon">
                <i class="fa-solid fa-address-book"></i>
            </div>

            <div>
                <div class="brand-title">
                    Contact<span>Hub</span>
                </div>

                <div class="brand-subtitle">
                    Smart Contact Manager
                </div>
            </div>

        </div>

        <div class="header-actions d-flex align-items-center gap-4">

            <button
                class="btn add-btn"
                data-bs-toggle="modal"
                data-bs-target="#addContactModal">
                <i class="fa-solid fa-plus me-2"></i>
                Add Contact
            </button>

            <i class="fa-solid fa-bell header-icon"></i>

            <i class="fa-solid fa-gear header-icon"></i>

            <img
                src="https://i.pravatar.cc/100?img=12"
                class="profile"
                alt="Profile"
            >

        </div>

    </div>
</nav>


<!-- ================= DASHBOARD ================= -->

<main class="dashboard">

    <div class="container-fluid px-4 px-lg-5">

        <!-- ================= STATS ================= -->

        <div class="row g-3 mb-5">

            <!-- TOTAL -->
            <div class="col-lg-4 col-md-6">

                <div class="stat-card">

                    <div class="stat-icon blue">
                        <i class="fa-solid fa-users"></i>
                    </div>

                    <div>
                        <div class="stat-label">Total</div>
                        <div class="stat-number">1</div>
                    </div>

                </div>

            </div>


            <!-- FAVORITES -->
            <div class="col-lg-4 col-md-6">

                <div class="stat-card">

                    <div class="stat-icon orange">
                        <i class="fa-solid fa-star"></i>
                    </div>

                    <div>
                        <div class="stat-label">Favorites</div>
                        <div class="stat-number">0</div>
                    </div>

                </div>

            </div>


            <!-- EMERGENCY -->
            <div class="col-lg-4 col-md-6">

                <div class="stat-card">

                    <div class="stat-icon red">
                        <i class="fa-solid fa-heart-pulse"></i>
                    </div>

                    <div>
                        <div class="stat-label">Emergency</div>
                        <div class="stat-number">0</div>
                    </div>

                </div>

            </div>

        </div>


        <!-- ================= CONTENT ================= -->

        <div class="row g-4">

            <!-- ================= LEFT ================= -->

            <div class="col-xl-9 col-lg-8">

                <div class="mb-4">

                    <h1 class="section-title">
                        All Contacts
                    </h1>

                    <p class="section-subtitle">
                        Manage and organize your 1 contacts
                    </p>

                </div>


                <!-- SEARCH -->

                <div class="search-box mb-4">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        placeholder="Search by name, phone, or email..."
                    >

                </div>


                <!-- CONTACT CARD -->

                <div class="row g-4" id="contacts">

                   

                </div>

            </div>


            <!-- ================= RIGHT ================= -->

            <div class="col-xl-3 col-lg-4">

                <!-- FAVORITES -->

                <div class="side-card mb-4">

                    <div class="side-header favorite-header">

                        <div class="side-icon orange">
                            <i class="fa-solid fa-star"></i>
                        </div>

                        <div>

                            <div class="side-title">
                                Favorites
                            </div>

                            <div class="side-subtitle">
                                Quick access to starred contacts
                            </div>

                        </div>

                    </div>

                    <div class="empty-message">
                        No favorites yet
                    </div>

                </div>


                <!-- EMERGENCY -->

                <div class="side-card">

                    <div class="side-header emergency-header">

                        <div class="side-icon red">
                            <i class="fa-solid fa-heart-pulse"></i>
                        </div>

                        <div>

                            <div class="side-title">
                                Emergency
                            </div>

                            <div class="side-subtitle">
                                Important contacts for urgent calls
                            </div>

                        </div>

                    </div>

                    <div class="empty-message">
                        No emergency contacts
                    </div>

                </div>

            </div>

        </div>

    </div>

</main>












<!-- ================= ADD CONTACT MODAL ================= -->

<!-- ADD CONTACT MODAL -->

<div
    class="modal fade"
    id="addContactModal"
    tabindex="-1"
    aria-labelledby="addContactModalLabel"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered modal-lg">

        <div class="modal-content contact-modal">

            <!-- HEADER -->
            <div class="modal-header contact-modal-header">

                <h2
                    class="modal-title"
                    id="addContactModalLabel"
                >
                    Add New Contact
                </h2>

                <button
                    type="button"
                    class="btn-close custom-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>


            <!-- BODY -->
            <div class="modal-body contact-modal-body">

                <form>

                    <!-- PROFILE PHOTO -->

                    <div class="text-center profile-upload">

                        <div class="profile-placeholder">
                            <i class="fa-solid fa-user"></i>
                        </div>

                        <button
                            type="button"
                            class="change-photo-btn"
                        >
                            <i class="fa-solid fa-camera me-2"></i>
                            Change Photo
                        </button>

                    </div>


                    <!-- FULL NAME -->

                    <div class="form-group-custom">

                        <label>
                            Full Name
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            class="form-control custom-input"
                            placeholder="Enter full name"
                            name="name"
                            id="name"
                            required
                        >

                    </div>


                    <!-- PHONE -->

                    <div class="form-group-custom">

                        <label>
                            Phone Number
                            <span>*</span>
                        </label>

                        <input
                            type="tel"
                            class="form-control custom-input"
                            placeholder="e.g., 01012345678"
                            name="phone"
                            id="phone"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group-custom">

                        <label>
                            Email Address
                        </label>

                        <input
                            type="email"
                            class="form-control custom-input"
                            placeholder="name@example.com"
                            name="email"
                            id="email"
                        >

                    </div>


                    <!-- ADDRESS -->

                    <div class="form-group-custom">

                        <label>
                            Address
                        </label>

                        <input
                            type="text"
                            class="form-control custom-input"
                            placeholder="Enter address"
                            name="address"
                            id="address"
                        >

                    </div>


                    <!-- GROUP -->

                    <div class="form-group-custom">

                        <label>
                            Group
                        </label>

                        <select class="form-select custom-input">

                            <option id="group" selected>
                                Select a group
                            </option>

                            <option value="family">Family</option>
                            <option value="friends">Friends</option>
                            <option value="work">Work</option>
                            <option value="other">Other</option>

                        </select>

                    </div>


                    <!-- NOTES -->

                    <div class="form-group-custom">

                        <label>
                            Notes
                        </label>

                        <textarea
                            name="notes"
                            id="notes"
                            class="form-control custom-input notes-input"
                            placeholder="Add notes about this contact"
                        ></textarea>

                    </div>


                    <!-- CHECKBOXES -->

                    <div class="contact-options">

                        <div class="custom-check">

                            <input
                                type="checkbox"
                                id="favorite"
                                
                            >

                            <label for="favorite">
                                <i class="fa-solid fa-star"></i>
                                Favorite
                            </label>

                        </div>


                        <div class="custom-check">

                            <input
                                type="checkbox"
                                id="emergency"
                            >

                            <label for="emergency">
                                <i class="fa-solid fa-heart-pulse"></i>
                                Emergency
                            </label>

                        </div>

                    </div>

                </form>

            </div>


            <!-- FOOTER -->

            <div class="modal-footer contact-modal-footer">

                <button
                    type="button"
                    class="cancel-btn"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="save-btn"
                    onclick="saveContact()"
                >
                    <i class="fa-solid fa-check me-2"></i>
                    Save Contact
                </button>

            </div>

        </div>

    </div>
</div>

















<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/script.js"></script>

</body>
</html>
